<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attachment Analysis</title>
  </head>
  <body>
    <h1>Attachment Upload and Analysis</h1>

    <!-- File Upload Form -->
    <form id="uploadform" enctype="multipart/form-data">
      <input type="file" id="myFiles" name="files" accept=".pdf,.doc,.docx" multiple />
      <button type="submit">Upload</button>
    </form>

    <h2 id="status"></h2>
    <h3 id="message"></h3>

    <!-- Analyze Attachment Form -->
    <h2>Analyze Uploaded Files</h2>
    <form id="analyzeForm">
      <select id="fileSelect">
        <option value="">Select a file</option>
      </select>
      <button type="submit">Analyze</button>
    </form>

    <h3 id="analysisResult"></h3>

    <script>
      const form = document.getElementById("uploadform");
      const analyzeForm = document.getElementById("analyzeForm");
      const fileSelect = document.getElementById("fileSelect");

      // ✅ Upload Files
      const sendFile = async () => {
        const myFiles = document.getElementById("myFiles").files;
        const formData = new FormData();

        // Append all files under the same field name "files"
        Array.from(myFiles).forEach((file) => {
          formData.append("files", file);
        });

        try {
          const response = await fetch("/upload-attachment", {
            method: "POST",
            body: formData,
          });

          const json = await response.json();

          // ✅ Update file dropdown
          if (json.filename) {
            const option = document.createElement("option");
            option.value = json.filename;
            option.textContent = json.filename;
            fileSelect.appendChild(option);
          }

          document.getElementById("status").textContent = `Status: ${response.status}`;
          document.getElementById("message").textContent = `Message: ${json?.message}`;
        } catch (error) {
          console.error("Error:", error);
          document.getElementById("message").textContent = "Upload failed.";
        }
      };

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        sendFile();
      });

      // ✅ Analyze Selected File
      const analyzeFile = async () => {
        const filename = fileSelect.value;
        if (!filename) {
          alert("Please select a file to analyze!");
          return;
        }

        try {
          const response = await fetch("/analyze-attachment", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ filename }),
          });

          const json = await response.json();
          document.getElementById("analysisResult").textContent = `Analysis: ${JSON.stringify(json)}`;
        } catch (error) {
          console.error("Error:", error);
          document.getElementById("analysisResult").textContent = "Analysis failed.";
        }
      };

      analyzeForm.addEventListener("submit", (e) => {
        e.preventDefault();
        analyzeFile();
      });
    </script>
  </body>
</html>
