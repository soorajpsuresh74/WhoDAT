<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attachment Analysis</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Attachment Analysis</a>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <h2 class="text-center">Analyze Your Attachments</h2>
          <form id="attachmentAnalysisForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="attachmentFile" class="form-label"
                >Upload Attachment File</label
              >
              <input
                type="file"
                class="form-control"
                id="attachmentFile"
                accept=".pdf,.doc,.docx,.xls,.xlsx,.txt"
              />
            </div>
            <button type="submit" class="btn btn-primary w-100">Analyze</button>
          </form>
          <div id="analysisResult" class="mt-4"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("attachmentAnalysisForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();
          let fileInput = document.getElementById("attachmentFile");
          let resultDiv = document.getElementById("analysisResult");

          if (fileInput.files.length === 0) {
            resultDiv.innerHTML =
              '<div class="alert alert-warning">Please upload an attachment file.</div>';
            return;
          }

          let formData = new FormData();
          formData.append("attachmentFile", fileInput.files[0]);

          try {
            let response = await fetch("/upload-attachment", {
              method: "POST",
              body: formData,
            });

            if (!response.ok) {
              throw new Error("Network response was not ok");
            }

            let data = await response.json();

            let analysisResponse = await fetch("/analyze-attachment", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ filename: data.filename }),
            });

            if (!analysisResponse.ok) {
              throw new Error("Analysis response was not ok");
            }

            let result = await analysisResponse.json();
            resultDiv.innerHTML = `
              <div class="alert alert-success">
                  <h4>Analysis Result</h4>
                  <p><strong>Filename:</strong> ${result.Filename}</p>
                  <p><strong>Content Summary:</strong> <pre>${result.ContentSummary}</pre></p>
                  <p><strong>Keywords:</strong> <pre>${JSON.stringify(
                    result.Keywords,
                    null,
                    2
                  )}</pre></p>
                  <p><strong>Links:</strong> <pre>${JSON.stringify(
                    result.Links,
                    null,
                    2
                  )}</pre></p>
              </div>
            `;
          } catch (error) {
            resultDiv.innerHTML =
              '<div class="alert alert-danger">Error analyzing the attachment. Please try again.</div>';
          }
        });
    </script>
  </body>
</html>
