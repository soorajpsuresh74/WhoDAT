<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="keywords" content="attachment analysis, file security, document scanning" />
    <meta name="description" content="Securely upload and analyze your documents to detect potential threats." />
    <meta name="author" content="Spering" />

    <title>Attachment Analysis</title>

    <link rel="stylesheet" href="css/bootstrap.css" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
</head>

<body>
    <div class="hero_area">
        <header class="header_section">
            <div class="container-fluid">
                <nav class="navbar navbar-expand-lg custom_nav-container">
                    <a class="navbar-brand" href="index.html">
                        <img src="images/logo.png" alt="Spering Logo" />
                        <span>WHODat</span>
                    </a>
                </nav>
            </div>
        </header>

        <section class="slider_section">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <div class="detail-box">
                            <h1>Analyze Attachments</h1>
                            <p>Securely upload and analyze your documents for potential threats.</p>
                            <div class="btn-box">
                                <a href="#fileUpload" class="btn-2">Start Analysis</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 img-container">
                        <div class="img-box">
                            <img src="images/What is Document Analysis.png" alt="Secure File Analysis">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <section class="experience_section layout_padding" id="fileUpload">
        <div class="container">
            <div class="row">
                <div class="col-md-5">
                    <div class="img-box">
                        <img src="images/What is Document Analysis.png" alt="Secure File Upload">
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="detail-box">
                        <div class="container">
                            <div class="card p-4">
                                <h2 class="text-center text-primary">Upload Your Files</h2>
                                <p class="text-center">Select and upload documents to analyze.</p>
                                <form id="uploadform" enctype="multipart/form-data">
                                    <div class="mb-3">
                                        <label for="myFiles" class="form-label">Select Files</label>
                                        <input type="file" id="myFiles" name="files" accept=".pdf,.doc,.docx" multiple class="form-control" />
                                    </div>
                                    <div class="btn-box">
                                        <button class="btn-1" type="submit">Upload</button>
                                    </div>
                                </form>
                                <div id="status" class="mt-2"></div>
                                <div id="message" class="mt-2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="analysis_section layout_padding" id="fileAnalysis">
        <div class="container">
            <div class="card p-4">
                <h2 class="text-center text-primary">Analyze Uploaded Files</h2>
                <form id="analyzeForm">
                    <div class="mb-3">
                        <label for="fileSelect" class="form-label">Select a file</label>
                        <select id="fileSelect" class="form-select">
                            <option value="">Select a file</option>
                        </select>
                    </div>
                    <div class="btn-box">
                        <button class="btn-1" type="submit">Analyze</button>
                    </div>
                </form>
                <div id="analysisResult" class="mt-3"></div>
            </div>
        </div>
    </section>

    <footer class="container-fluid footer_section">
        <div class="container">
            <p>&copy; <span id="displayDate"></span> All Rights Reserved | Spering</p>
        </div>
    </footer>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script>
        document.getElementById("uploadform").addEventListener("submit", async (e) => {
            e.preventDefault();
            const myFiles = document.getElementById("myFiles").files;
            const formData = new FormData();
            Array.from(myFiles).forEach((file) => formData.append("files", file));
            try {
                const response = await fetch("/upload-attachment", { method: "POST", body: formData });
                const json = await response.json();
                if (json.filename) {
                    const option = document.createElement("option");
                    option.value = json.filename;
                    option.textContent = json.filename;
                    document.getElementById("fileSelect").appendChild(option);
                }
                document.getElementById("status").textContent = `Status: ${response.status}`;
                document.getElementById("message").textContent = `Message: ${json.message}`;
            } catch (error) {
                document.getElementById("message").textContent = "Upload failed.";
            }
        });

        document.getElementById("analyzeForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const filename = document.getElementById("fileSelect").value;
            if (!filename) {
                alert("Please select a file to analyze!");
                return;
            }
            try {
                const response = await fetch("/analyze-attachment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ filename }),
                });
                const json = await response.json();
                document.getElementById("analysisResult").innerHTML = `
                    <p><strong>Message:</strong> ${json.analysis.message}</p>
                    <p><strong>Malicious:</strong> ${json.analysis.analysis.Malicious}</p>
                    <p><strong>Suspicious:</strong> ${json.analysis.analysis.Suspicious}</p>
                    <p><strong>Harmless:</strong> ${json.analysis.analysis.Harmless}</p>
                    <p><strong>Undetected:</strong> ${json.analysis.analysis.Undetected}</p>
                `;
            } catch (error) {
                document.getElementById("analysisResult").textContent = "Analysis failed.";
            }
        });
    </script>
</body>
</html>
