<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMARC Lookup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">DMARC Lookup</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h2 class="text-center">Check DMARC Record</h2>
                <form id="dmarcLookupForm">
                    <div class="mb-3">
                        <label for="domainInput" class="form-label">Enter Domain</label>
                        <input type="text" class="form-control" id="domainInput" placeholder="example.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Check DMARC</button>
                </form>
                <div id="lookupResult" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("dmarcLookupForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let domainInput = document.getElementById("domainInput").value.trim();
            let resultDiv = document.getElementById("lookupResult");

            if (!domainInput) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a domain.</div>';
                return;
            }

            try {
                let response = await fetch("/check-dmarc", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ domain: domainInput }),
                });

                if (!response.ok) throw new Error("Network error");

                let result = await response.json();
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h4>DMARC Record</h4>
                        <p><strong>Domain:</strong> ${result.domain}</p>
                        <p><strong>DMARC Policy:</strong> ${result.dmarc_policy || 'Not Found'}</p>
                        <p><strong>DMARC Record:</strong> ${result.dmarc_record || 'No DMARC Record'}</p>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error fetching DMARC record. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
