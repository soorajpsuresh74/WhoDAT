<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Analysis | WhoDAT</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

    <!-- Custom Styles -->
    <style>
        body {
            background: url("images/background.jpg") no-repeat center center fixed;
            background-size: cover;
            font-family: "Poppins", sans-serif;
        }

        .container {
            max-width: 700px;
            margin-top: 50px;
        }

        .card {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .custom-button {
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            font-size: 18px;
            transition: 0.3s ease-in-out;
            width: 100%;
        }

        .custom-button:hover {
            background-color: #0056b3;
        }

        /* Result Accordion */
        .accordion-button {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        .accordion-body {
            background-color: #fff;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="WhoDAT Logo" width="40" class="me-2" />
                <span>WhoDAT</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="work.html">Work</a></li>
                    <li class="nav-item"><a class="nav-link" href="category.html">Category</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-3" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="card p-4">
            <h2 class="text-center text-primary">Email Analysis</h2>
            <form id="emailAnalysisForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="emailFile" class="form-label">Upload Email File</label>
                    <input type="file" class="form-control" id="emailFile" accept=".txt,.eml" />
                </div>
                <button type="submit" class="btn custom-button">Analyze</button>
            </form>

            <!-- Results Section -->
            <div id="analysisResult" class="mt-4"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript for Handling File Upload and API Call -->
    <script>
        document.getElementById("emailAnalysisForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let fileInput = document.getElementById("emailFile");
            let resultDiv = document.getElementById("analysisResult");

            if (fileInput.files.length === 0) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please upload an email file.</div>';
                return;
            }

            let formData = new FormData();
            formData.append("emailFile", fileInput.files[0]);

            try {
                let response = await fetch("/upload-email", {
                    method: "POST",
                    body: formData,
                });

                if (!response.ok) throw new Error("Network response was not ok");

                let data = await response.json();

                let fastApiResponse = await fetch("/analyze-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ filename: data.filename }),
                });

                if (!fastApiResponse.ok) throw new Error("FastAPI response was not ok");

                let result = await fastApiResponse.json();

                resultDiv.innerHTML = `
                    <h4 class="text-center text-success">Analysis Result</h4>
                    <div class="accordion" id="resultAccordion">
                        ${generateResultSection("Filename", result.Filename, 1)}
                        ${generateResultSection("Headers", result.Headers?.Data ?? result.Headers, 2)}
                        ${generateResultSection("Digests", result.Digests?.Data ?? result.Digests, 3)}
                        ${generateResultSection("Links", result.Links?.Data ?? result.Links, 4)}
                        ${generateResultSection("Attachments", result.Attachments?.Data ?? result.Attachments, 5)}
                        ${generateResultSection("Body", result.Body, 6)}
                        ${generateResultSection("Toxic Prediction", result["Toxic Prediction"], 7)}
                        ${generateResultSection("Spam Prediction", result["Spam Prediction"], 8)}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error analyzing the email. Please try again.</div>';
            }
        });

        function generateResultSection(title, data, index) {
            return `
                <div class="accordion-item">
                    <h2 class="accordion-header" id="heading${index}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapse${index}" aria-expanded="false" aria-controls="collapse${index}">
                            ${title}
                        </button>
                    </h2>
                    <div id="collapse${index}" class="accordion-collapse collapse" aria-labelledby="heading${index}" data-bs-parent="#resultAccordion">
                        <div class="accordion-body">
                            <pre>${JSON.stringify(data, null, 2) || "N/A"}</pre>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>

</html>
