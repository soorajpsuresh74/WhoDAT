<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            border-radius: 8px;
        }
        .btn-primary {
            border-radius: 8px;
        }
        .loading {
            display: none;
            text-align: center;
            font-size: 1.2rem;
            color: #007bff;
        }
        .spinner-border {
            width: 2rem;
            height: 2rem;
        }
        .badge {
            font-size: 1rem;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">URL Analysis</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card p-4">
                    <h2 class="text-center mb-4">Analyze a URL</h2>
                    <form id="urlAnalysisForm">
                        <div class="mb-3">
                            <label for="urlInput" class="form-label">Enter URL</label>
                            <input type="text" class="form-control" id="urlInput" placeholder="https://example.com">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Analyze</button>
                    </form>
                    <div class="loading mt-3" id="loading">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p>Analyzing URL, please wait...</p>
                    </div>
                    <div id="analysisResult" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("urlAnalysisForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let urlInput = document.getElementById("urlInput").value.trim();
            let resultDiv = document.getElementById("analysisResult");
            let loadingIndicator = document.getElementById("loading");

            resultDiv.innerHTML = "";
            if (!isValidURL(urlInput)) {
                resultDiv.innerHTML = '<div class="alert alert-warning text-center">Please enter a valid URL.</div>';
                return;
            }

            loadingIndicator.style.display = "block";

            try {
                let response = await fetch("/analyze-url", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: urlInput }),
                });

                if (!response.ok) throw new Error("Network error");

                let result = await response.json();
                displayAnalysis(result);
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger text-center">Error analyzing the URL. Please try again.</div>';
            } finally {
                loadingIndicator.style.display = "none";
            }
        });

        function isValidURL(url) {
            let pattern = /^(https?:\/\/)?([\w\d.-]+)\.([a-z]{2,6})([\/\w\d.-]*)*\/?$/;
            return pattern.test(url);
        }

        function displayAnalysis(result) {
            let resultDiv = document.getElementById("analysisResult");

            if (!result || typeof result.status === "undefined") {
                resultDiv.innerHTML = "<div class='alert alert-danger text-center'>Invalid analysis data.</div>";
                return;
            }

            let html = `
                <div class="card p-3">
                    <h5 class="card-title text-center">Analysis Result</h5>
                    <p class="analysis-item"><strong>URL:</strong> <a href="${result.link}" target="_blank">${result.link}</a></p>
                    <p class="analysis-item"><strong>Status:</strong> ${result.status ? '<span class="badge bg-success">Success</span>' : '<span class="badge bg-danger">Failed</span>'}</p>
                    <p class="analysis-item"><strong>Malicious:</strong> <span class="badge bg-danger">${result.malicious}</span></p>
                    <p class="analysis-item"><strong>Suspicious:</strong> <span class="badge bg-warning">${result.suspicious}</span></p>
                    <p class="analysis-item"><strong>Harmless:</strong> <span class="badge bg-success">${result.harmless}</span></p>
                    <p class="analysis-item"><strong>Undetected:</strong> <span class="badge bg-secondary">${result.undetected}</span></p>
                    <p class="analysis-item"><strong>Redirects:</strong> ${result.redirects.length > 0 ? result.redirects.join(', ') : 'None'}</p>
                </div>
            `;

            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
