<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">IP Analysis</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h2 class="text-center">Analyze an IP Address</h2>
                <form id="ipAnalysisForm">
                    <div class="mb-3">
                        <label for="ipAddress" class="form-label">Enter IP Address</label>
                        <input type="text" class="form-control" id="ipAddress" placeholder="192.168.1.1">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze</button>
                </form>
                <div id="analysisResult" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("ipAnalysisForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let ipInput = document.getElementById("ipAddress").value.trim();
            let resultDiv = document.getElementById("analysisResult");

            if (!ipInput) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter an IP address.</div>';
                return;
            }

            try {
                let response = await fetch("/analyze-ip", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ip: ipInput }),
                });

                if (!response.ok) throw new Error("Network error");

                let result = await response.json();
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h4>Analysis Result</h4>
                        <p><strong>IP Address:</strong> ${result.ip}</p>
                        <p><strong>Geolocation:</strong> ${result.geolocation}</p>
                        <p><strong>Blacklist Status:</strong> ${result.blacklist_status}</p>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error analyzing the IP. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
