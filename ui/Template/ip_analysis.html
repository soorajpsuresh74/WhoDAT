<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="keywords" content="IP Analysis, IP lookup, network security" />
    <meta name="description" content="Analyze an IP address to gather details about geolocation, blacklist status, and more." />
    <meta name="author" content="IP Analysis" />

    <title>IP Analysis</title>

    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
</head>

<body>
    <div class="hero_area">
        <header class="header_section">
            <div class="container-fluid">
                <nav class="navbar navbar-expand-lg custom_nav-container">
                    <a class="navbar-brand" href="index.html">
                        <img src="images/logo.png" alt="IP Analysis Logo" />
                        <span>WHODat</span>
                    </a>
                </nav>
            </div>
        </header>

        <section class="slider_section">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <div class="detail-box">
                            <h1>Analyze an IP Address</h1>
                            <p>Enter an IP address to check its geolocation, blacklist status, and more.</p>
                            <div class="btn-box">
                                <a href="#ipCheck" class="btn-2">Start Analysis</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 img-container">
                        <div class="img-box">
                            <img src="images/What-is-an-IP-Address.jpg" alt="IP Analysis">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <section class="experience_section layout_padding" id="ipCheck">
        <div class="container">
            <div class="row">
                <div class="col-md-5">
                    <div class="img-box">
                        <img src="images/What-is-an-IP-Address.jpg" alt="IP Security">
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="detail-box">
                        <div class="container">
                            <div class="card p-4">
                                <h2 class="text-center text-primary">IP Address Analysis</h2>
                                <p class="text-center">Enter an IP address to analyze geolocation and blacklist status.</p>
                                <form id="ipAnalysisForm">
                                    <div class="mb-3">
                                        <label for="ipAddress" class="form-label">IP Address</label>
                                        <input type="text" class="form-control" id="ipAddress" placeholder="192.168.1.1">
                                    </div>
                                    <div class="btn-box">
                                        <button class="btn-1" type="submit">Analyze</button>
                                    </div>
                                </form>
                                <div id="analysisResult" class="mt-4"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="container-fluid footer_section">
        <div class="container">
            <p>&copy; <span id="displayDate"></span> All Rights Reserved | IP Analysis</p>
        </div>
    </footer>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script>
        document.getElementById("ipAnalysisForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            let ipInput = document.getElementById("ipAddress").value.trim();
            let resultDiv = document.getElementById("analysisResult");

            if (!ipInput) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a valid IP address.</div>';
                return;
            }

            try {
                let response = await fetch("/analyze-ip", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ip: ipInput }),
                });

                if (!response.ok) throw new Error("Network error");

                let result = await response.json();
                let html = `<div class="alert alert-success"><h4>IP Analysis Result</h4>`;

                html += `<p><strong>IP Address:</strong> ${result.ip}</p>`;
                html += `<p><strong>Geolocation:</strong> ${result.geolocation}</p>`;
                html += `<p><strong>Blacklist Status:</strong> ${result.blacklist_status}</p>`;
                html += `</div>`;

                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error analyzing the IP. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
