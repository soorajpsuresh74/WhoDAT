<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .spinner-border {
            display: none;
            margin: 10px auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">IP Analysis</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-lg">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Analyze an IP Address</h3>
                        <form id="ipAnalysisForm">
                            <div class="mb-3">
                                <label for="ipAddress" class="form-label">Enter IP Address</label>
                                <input type="text" class="form-control" id="ipAddress" placeholder="192.168.1.1">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Analyze</button>
                        </form>
                        <div class="text-center mt-3">
                            <div class="spinner-border text-primary" role="status" id="loadingSpinner">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div id="analysisResult" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("ipAnalysisForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let ipInput = document.getElementById("ipAddress").value.trim();
            let resultDiv = document.getElementById("analysisResult");
            let loadingSpinner = document.getElementById("loadingSpinner");

            resultDiv.innerHTML = "";  
            loadingSpinner.style.display = "block";  

            if (!ipInput) {
                loadingSpinner.style.display = "none";
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a valid IP address.</div>';
                return;
            }

            try {
                let response = await fetch("/analyze-ip", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ip: ipInput }),
                });

                if (!response.ok) throw new Error("Failed to fetch data. Please try again.");

                let result = await response.json();
                loadingSpinner.style.display = "none";

                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h4 class="mb-3">Analysis Result</h4>
                        <p><strong>IP Address:</strong> ${result.ip}</p>
                        <p><strong>Geolocation:</strong> ${result.geolocation}</p>
                        <p><strong>Blacklist Status:</strong> ${result.blacklist_status}</p>
                    </div>
                `;
            } catch (error) {
                loadingSpinner.style.display = "none";
                resultDiv.innerHTML = '<div class="alert alert-danger">Error analyzing the IP. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
