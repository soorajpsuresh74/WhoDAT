<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHOIS Lookup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">WHOIS Lookup</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h2 class="text-center">WHOIS Domain Lookup</h2>
                <form id="whoisLookupForm">
                    <div class="mb-3">
                        <label for="domainInput" class="form-label">Enter Domain Name</label>
                        <input type="text" class="form-control" id="domainInput" placeholder="example.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Lookup</button>
                </form>
                <div id="whoisResult" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("whoisLookupForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let domainInput = document.getElementById("domainInput").value.trim();
            let resultDiv = document.getElementById("whoisResult");

            if (!domainInput) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a domain name.</div>';
                return;
            }

            try {
                let response = await fetch("/whois-lookup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ domain: domainInput }),
                });

                if (!response.ok) throw new Error("Network error");

                let result = await response.json();
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h4>WHOIS Information</h4>
                        <p><strong>Domain:</strong> ${result.domain}</p>
                        <p><strong>Domain ID:</strong> ${result.domain_id}</p>
                        <p><strong>Status:</strong> ${result.status}</p>
                        <p><strong>Creation Date:</strong> ${result.create_date}</p>
                        <p><strong>Update Date:</strong> ${result.update_date}</p>
                        <p><strong>Expiration Date:</strong> ${result.expire_date}</p>
                        <p><strong>Domain Age:</strong> ${result.domain_age} days</p>
                        <p><strong>WHOIS Server:</strong> ${result.whois_server}</p>
                        <h5>Registrar</h5>
                        <p><strong>Name:</strong> ${result.registrar.name}</p>
                        <p><strong>URL:</strong> <a href="${result.registrar.url}" target="_blank">${result.registrar.url}</a></p>
                        <h5>Registrant</h5>
                        <p><strong>Name:</strong> ${result.registrant.name}</p>
                        <p><strong>Organization:</strong> ${result.registrant.organization}</p>
                        <p><strong>Address:</strong> ${result.registrant.street_address}, ${result.registrant.city}, ${result.registrant.region}, ${result.registrant.zip_code}, ${result.registrant.country}</p>
                        <p><strong>Phone:</strong> ${result.registrant.phone}</p>
                        <p><strong>Email:</strong> <a href="${result.registrant.email}" target="_blank">Contact</a></p>
                        <h5>Nameservers</h5>
                        <ul>${result.nameservers.map(ns => `<li>${ns}</li>`).join('')}</ul>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error retrieving WHOIS data. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
