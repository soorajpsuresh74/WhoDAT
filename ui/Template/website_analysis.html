<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="keywords" content="website analysis, security check, malicious detection" />
    <meta name="description" content="Analyze websites for security threats, malicious content, and performance issues." />
    <meta name="author" content="Spering" />
    <title>WhoDat - Website Analysis</title>

    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
</head>
<body>
    <div class="hero_area">
        <header class="header_section">
            <div class="container-fluid">
                <nav class="navbar navbar-expand-lg custom_nav-container">
                    <a class="navbar-brand" href="index.html">
                        <img src="images/logo.png" alt="Spering Logo" />
                        <span>WHODat</span>
                    </a>
                </nav>
            </div>
        </header>

        <section class="slider_section">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <div class="detail-box">
                            <h1>Analyze a Website</h1>
                            <p>Enter a website URL to analyze its security, performance, and potential threats.</p>
                            <div class="btn-box">
                                <a href="#websiteAnalysis" class="btn-2">Start Analysis</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 img-container">
                        <div class="img-box">
                            <img src="images/Website-Analysis-Tools.jpg" alt="Website Analysis">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <section class="experience_section layout_padding" id="websiteAnalysis">
        <div class="container">
            <div class="row">
                <div class="col-md-5">
                    <div class="img-box">
                        <img src="images/Website-Analysis-Tools.jpg" alt="Website Analysis">
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="detail-box">
                        <div class="container">
                            <div class="card p-4">
                                <h2 class="text-center text-primary">Website Analysis</h2>
                                <p class="text-center">Enter a website URL to check its security and performance.</p>
                                <form id="websiteAnalysisForm">
                                    <div class="mb-3">
                                        <label for="websiteInput" class="form-label">Website URL</label>
                                        <input type="text" class="form-control" id="websiteInput" placeholder="https://example.com">
                                    </div>
                                    <div class="btn-box">
                                        <button class="btn-1" type="submit">Analyze</button>
                                    </div>
                                </form>
                                <div id="loadingSpinner" class="text-center mt-3" style="display: none;">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                                <div id="analysisResult" class="mt-4"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="container-fluid footer_section">
        <div class="container">
            <p>&copy; <span id="displayDate"></span> All Rights Reserved | Website Analyzer by Spering</p>
        </div>
    </footer>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script>
        document.getElementById("websiteAnalysisForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            let websiteInput = document.getElementById("websiteInput").value.trim();
            let resultDiv = document.getElementById("analysisResult");
            let spinner = document.getElementById("loadingSpinner");
            resultDiv.innerHTML = "";
            spinner.style.display = "block";

            if (!isValidURL(websiteInput)) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a valid website URL.</div>';
                spinner.style.display = "none";
                return;
            }

            try {
                let response = await fetch("/analyze-website", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ website: websiteInput }),
                });
                if (!response.ok) throw new Error("Network error");
                let result = await response.json();
                displayAnalysis(result);
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error analyzing the website. Please try again.</div>';
            } finally {
                spinner.style.display = "none";
            }
        });

        function displayAnalysis(result) {
            let resultDiv = document.getElementById("analysisResult");
            let html = `<div><strong>Website:</strong> ${result.website}</div>`;
            html += `<div><strong>Malicious Status:</strong> ${result.malicious_status}</div>`;
            html += `<div><strong>Screenshot:</strong> ${result.screenshot ? `<img src="${result.screenshot}" class="img-fluid" alt="Screenshot">` : 'Not Available'}</div>`;
            html += `<div><strong>Scan Results:</strong> Checking...</div>`;
            resultDiv.innerHTML = html;
            pollScanResult(result.website, 10);
        }

        function isValidURL(url) {
            try {
                new URL(url);
                return true;
            } catch (_) {
                return false;
            }
        }
    </script>
</body>
</html>
