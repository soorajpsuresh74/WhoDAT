<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .analysis-section { margin-top: 20px; }
        .analysis-item { margin-bottom: 10px; }
        .screenshot-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 10px;
        }
        .spinner-border { display: none; } /* Initially hidden */
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Website Analysis</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h2 class="text-center">Analyze a Website</h2>
                <form id="websiteAnalysisForm">
                    <div class="mb-3">
                        <label for="websiteInput" class="form-label">Enter Website URL</label>
                        <input type="text" class="form-control" id="websiteInput" placeholder="https://example.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze</button>
                </form>
                <div id="loadingSpinner" class="text-center mt-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div id="analysisResult" class="mt-4 analysis-section"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("websiteAnalysisForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let websiteInput = document.getElementById("websiteInput").value.trim();
            let resultDiv = document.getElementById("analysisResult");
            let spinner = document.getElementById("loadingSpinner");

            resultDiv.innerHTML = "";
            spinner.style.display = "block"; // Show spinner

            if (!isValidURL(websiteInput)) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a valid website URL.</div>';
                spinner.style.display = "none"; // Hide spinner
                return;
            }

            try {
                let response = await fetch("/analyze-website", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ website: websiteInput }),
                });

                if (!response.ok) throw new Error("Network error");

                let result = await response.json();
                displayAnalysis(result);
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error analyzing the website. Please try again.</div>';
            } finally {
                spinner.style.display = "none"; // Hide spinner
            }
        });

        function displayAnalysis(result) {
            let resultDiv = document.getElementById("analysisResult");
            let html = `
                <div class="analysis-item"><strong>Website:</strong> ${result.website}</div>
                <div class="analysis-item"><strong>Malicious Status:</strong> ${result.malicious_status}</div>
                <div class="analysis-item"><strong>Screenshot:</strong> ${result.screenshot ? `<img src="${result.screenshot}" class="screenshot-img" alt="Screenshot">` : 'Not Available'}</div>
                <div class="analysis-item"><strong>Scan Results:</strong> Checking...</div>
            `;
            resultDiv.innerHTML = html;

            pollScanResult(result.website, 10); // Max retries: 10
        }

        function pollScanResult(website, maxRetries, attempt = 1) {
            fetch("/get-scan-result", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ website: website }),
            })
            .then(response => response.json())
            .then(updatedResult => {
                if (updatedResult.scan_result) {
                    let fullHtml = `
                        <div class="analysis-item"><strong>Website:</strong> ${updatedResult.website}</div>
                        <div class="analysis-item"><strong>Malicious Status:</strong> ${updatedResult.malicious_status}</div>
                        <div class="analysis-item"><strong>Screenshot:</strong> ${updatedResult.screenshot ? `<img src="${updatedResult.screenshot}" class="screenshot-img" alt="Screenshot">` : 'Not Available'}</div>
                        <div class="analysis-item"><strong>Scan ID:</strong> ${updatedResult.scan_result.task.uuid}</div>
                        <div class="analysis-item"><strong>Domain:</strong> ${updatedResult.scan_result.result.domain}</div>
                        <div class="analysis-item"><strong>IP:</strong> ${updatedResult.scan_result.result.ip}</div>
                    `;

                    if (updatedResult.scan_result.verdicts) {
                        fullHtml += `<div class="analysis-item"><strong>Malicious:</strong> ${updatedResult.scan_result.verdicts.malicious.overall}</div>`;
                    }
                    if (updatedResult.scan_result.stats) {
                        fullHtml += `<div class="analysis-item"><strong>Page Load Time:</strong> ${updatedResult.scan_result.stats.pageLoadTime} ms</div>`;
                    }
                    document.getElementById("analysisResult").innerHTML = fullHtml;
                } else if (attempt < maxRetries) {
                    setTimeout(() => pollScanResult(website, maxRetries, attempt + 1), 5000); // Retry every 5 seconds
                } else {
                    document.getElementById("analysisResult").innerHTML += `<div class="analysis-item text-danger"><strong>Scan timeout: No response received.</strong></div>`;
                }
            })
            .catch(error => {
                console.error("Error polling scan results:", error);
                document.getElementById("analysisResult").innerHTML += '<div class="analysis-item text-danger"><strong>Error polling scan results.</strong></div>';
            });
        }

        function isValidURL(url) {
            try {
                new URL(url);
                return true;
            } catch (_) {
                return false;
            }
        }
    </script>
</body>
</html>
