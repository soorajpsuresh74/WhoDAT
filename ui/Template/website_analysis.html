<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Website Analysis</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h2 class="text-center">Analyze a Website</h2>
                <form id="websiteAnalysisForm">
                    <div class="mb-3">
                        <label for="websiteInput" class="form-label">Enter Website URL</label>
                        <input type="text" class="form-control" id="websiteInput" placeholder="https://example.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze</button>
                </form>
                <div id="analysisResult" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("websiteAnalysisForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            let websiteInput = document.getElementById("websiteInput").value.trim();
            let resultDiv = document.getElementById("analysisResult");

            if (!websiteInput) {
                resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a website URL.</div>';
                return;
            }

            try {
                let response = await fetch("/analyze-website", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ website: websiteInput }),
                });

                if (!response.ok) throw new Error("Network error");

                let result = await response.json();
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h4>Analysis Result</h4>
                        <p><strong>Website:</strong> ${result.website}</p>
                        <p><strong>SSL Status:</strong> ${result.ssl_status}</p>
                        <p><strong>Domain Age:</strong> ${result.domain_age}</p>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error analyzing the website. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
